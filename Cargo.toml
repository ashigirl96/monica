[workspace]
members = ["crates/*", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
tania-logfile = { path = "crates/logfile" }
tania-terminal-client = { path = "crates/terminal-client" }
tania-terminal-daemon = { path = "crates/terminal-daemon" }
tania-terminal-protocol = { path = "crates/terminal-protocol" }

anyhow = "1.0.102"
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = { version = "0.2", default-features = false }
log = "0.4"
portable-pty = { version = "0.9", default-features = false }
serde = { version = "1.0.228", default-features = false }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
