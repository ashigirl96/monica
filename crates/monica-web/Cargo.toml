[package]
name = "monica-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Monica HTTP server for external browser access"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
log.workspace = true
monica-api.workspace = true
monica-application.workspace = true
monica-domain.workspace = true
monica-paths.workspace = true
monica-runtime.workspace = true
monica-settings.workspace = true
rust-embed.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }

[dev-dependencies]
ctor.workspace = true
http-body-util.workspace = true
monica-storage-sqlite.workspace = true
specta = { workspace = true, features = ["derive", "serde_json"] }
specta-serde.workspace = true
specta-typescript.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true
