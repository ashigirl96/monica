[package]
name = "claude-agent-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust port of the Claude Agent SDK driving `claude` via stream-json I/O"

[dependencies]
async-trait.workspace = true
futures-core.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_json.workspace = true
# std feature は serde_json feature の暗黙の前提（rc 版の feature 宣言漏れ）。
# workspace ビルドでは他 crate 経由で有効化されるが、-p 単独ビルドで壊れるため明示する
specta = { workspace = true, features = ["derive", "std", "serde_json"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util.workspace = true
typed-builder.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
