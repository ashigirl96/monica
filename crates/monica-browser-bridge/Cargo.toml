[package]
name = "monica-browser-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Browser extension ↔ Claude localhost WebSocket bridge"

[[bin]]
name = "monica-browser-bridge"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
claude-agent-sdk.workspace = true
env_logger.workspace = true
futures-util.workspace = true
log.workspace = true
monica-paths.workspace = true
monica-settings.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
