[package]
name = "monica-desktop"
version.workspace = true
description = "monica desktop app"
authors = ["ashigirl96"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "monica_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# tauri / tauri-build は [workspace.dependencies] に上げない。Tauri CLI は tauri.conf.json の
# 内容から tauri の features 配列を書き戻して同期するが、workspace 継承にするとその同期を
# 諦める。一方 tauri-build の check_features はコンパイルのたびに features と config の一致を
# 要求し続けるため、conf を変えるたびに手で直す羽目になる。どちらもこの crate 専用。
[build-dependencies]
tauri-build = { version = "2", default-features = false, features = [] }

[dependencies]
anyhow.workspace = true
log.workspace = true
monica-api.workspace = true
monica-application.workspace = true
monica-domain.workspace = true
monica-logfile.workspace = true
serde = { workspace = true, features = ["derive"] }
monica-runtime.workspace = true
monica-paths.workspace = true
monica-settings.workspace = true
monica-terminal-client.workspace = true
monica-web.workspace = true
monica-terminal-protocol.workspace = true
specta = { workspace = true, features = ["serde_json"] }
specta-typescript.workspace = true
tauri = { version = "2", default-features = false, features = [
  "devtools",
  "wry",
  "macos-private-api",
  "protocol-asset",
] }
tauri-specta.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-mcp-bridge.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSArray"] }
objc2-app-kit = { workspace = true, features = ["NSPasteboard", "NSImage", "NSPasteboardItem"] }
