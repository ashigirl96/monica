name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    name: ts
    runs-on: ubuntu-latest
    # テストの中の同期の無限ループは bun test の timeout では止まらず、既定では 360 分走り続ける。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:ts
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PR の途中の commit で入れて後の commit で消した secret も、履歴には残るので全履歴を見る。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo zricethezav/gitleaks:v8.30.1 git --redact --no-banner

  # job 単位の paths filter は GitHub Actions に無く、macOS の runner は 1 分が 10 分に数えられるので、変更の判定は ubuntu で行う。
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - "crates/**"
              - "apps/desktop/src-tauri/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: bun run check:rust
