[package]
name = "tania-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tania_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# tauri と tauri-build は workspace.dependencies に上げない。Tauri CLI は tauri.conf.json から
# tauri の features を書き戻すが、workspace 継承にするとその同期を諦めるため。
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shared_child = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# 登録するのは debug build だけ。Cargo は profile で依存を切り替えられないので release にも入る。
tauri-plugin-mcp-bridge = { version = "0.13", default-features = false }
