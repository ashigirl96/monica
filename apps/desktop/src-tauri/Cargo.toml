[package]
name = "monica-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "monica_desktop_lib"

# tauri と tauri-build は workspace.dependencies に上げない。Tauri CLI は tauri.conf.json から
# tauri の features を書き戻すが、workspace 継承にするとその同期を諦めるため。
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
block2 = "0.6"
libc.workspace = true
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSImage",
  "NSPasteboard",
  "NSPasteboardItem",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSArray",
  "NSBundle",
  "NSDictionary",
  "NSError",
  "NSString",
  "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "bitflags",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shared_child = "1"
monica-terminal-client.workspace = true
monica-terminal-protocol.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# 登録するのは debug build だけ。Cargo は profile で依存を切り替えられないので release にも入る。
tauri-plugin-mcp-bridge = { version = "0.13", default-features = false }

[lints]
workspace = true
