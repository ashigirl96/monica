name: Monica
options:
  deploymentTarget:
    iOS: '26.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Monica:
    type: application
    platform: iOS
    sources:
      - Native
      - path: dist
        type: folder
    info:
      path: Native/Info.plist
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.64.0.0/10:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.2
              NSExceptionRequiresForwardSecrecy: true
            'fd7a:115c:a1e0::/48':
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.2
              NSExceptionRequiresForwardSecrecy: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.monica.iphone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: monica
        INFOPLIST_KEY_NSCameraUsageDescription: Macの登録QRを読み取ります。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 登録したMacへTailscale経由で接続します。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  MonicaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Monica
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.monica.iphone.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Monica:
    build:
      targets:
        Monica: all
        MonicaTests: [test]
    test:
      targets: [MonicaTests]
      gatherCoverageData: true
